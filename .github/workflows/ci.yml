name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @cms/api exec prisma generate

      # --- Architecture gate (must pass before any code runs) ---
      - name: Dependency Cruiser
        run: pnpm run depcruise

      # --- Static analysis ---
      - name: Lint (API)
        run: pnpm --filter @cms/api lint

      - name: Lint (Web)
        run: pnpm --filter @cms/web lint

      - name: Typecheck (API)
        run: pnpm --filter @cms/api typecheck

      - name: Typecheck (Web)
        run: pnpm --filter @cms/web tsc --noEmit

      # --- Tests ---
      - name: Test (API)
        run: pnpm --filter @cms/api test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_URL: redis://localhost:6379
          APP_BASE_URL: http://localhost:3000
          EMAIL_PROVIDER: console
          EMAIL_FROM: no-reply@cms.example.com
          EMAIL_FROM_NAME: CMS
          PUBLIC_URL: http://localhost:5173
          OBJECT_STORAGE_ENDPOINT: ${{ secrets.OBJECT_STORAGE_ENDPOINT }}
          OBJECT_STORAGE_REGION: ${{ secrets.OBJECT_STORAGE_REGION }}
          OBJECT_STORAGE_BUCKET: ${{ secrets.OBJECT_STORAGE_BUCKET }}
          OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
          OBJECT_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
          OBJECT_STORAGE_PUBLIC_URL: ${{ secrets.OBJECT_STORAGE_PUBLIC_URL }}

      - name: Test (Web)
        run: pnpm --filter @cms/web exec vitest run

      # --- Build ---
      - name: Build
        run: pnpm run build
